name = "r2-downloader"
compatibility_date = "2026-01-01"

pages_build_output_dir="src"


# R2 bucket binding
[[r2_buckets]]
binding = "WEBDAV_STORAGE"
bucket_name = "my-drive-bucket"
preview_bucket_name = "my-drive-bucket-preview"  # Optional: separate bucket for dev

# Durable Objects configuration
[durable_objects]
bindings = [
  { name = "DOWNLOAD_MANAGER", class_name = "DownloadManager",script_name="r2-downloader" }
]

# Optional: Environment variables
[vars]
# Add any environment variables here